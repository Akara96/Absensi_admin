{% extends 'dashboard/base.html' %}

{% block content %}
<div class="topbar d-flex justify-content-between align-items-center">
    <div>
        <h4 class="mb-1 fw-bold">Hatama Funsonáriu Foun</h4>
        <p class="text-muted mb-0">Prenxe formuláriu iha okos atu rejista funsonáriu/staff foun.</p>
    </div>
    <a href="{% url 'dashboard_pegawai' %}" class="btn btn-light btn-premium">
        <i class="fas fa-arrow-left me-2"></i>Fila fali
    </a>
</div>

<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="card p-4">
            {% if error %}
            <div class="alert alert-danger border-0 rounded-3 small py-3 mb-4">
                <i class="fas fa-exclamation-circle me-2"></i>
                {{ error }}
            </div>
            {% endif %}

            <form method="POST" enctype="multipart/form-data">
                {% csrf_token %}
                <div class="row g-4">
                    <div class="col-md-6">
                        <label class="form-label small fw-bold">NRE (Username)</label>
                        <input type="text" name="nre" class="form-control rounded-3" placeholder="Ezemplu: 001/P" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label small fw-bold">Password Login</label>
                        <input type="password" name="password" class="form-control rounded-3" placeholder="••••••••" required>
                    </div>
                    
                    <div class="col-12">
                        <label class="form-label small fw-bold">Naran Kompletu</label>
                        <input type="text" name="naran" class="form-control rounded-3" placeholder="Hatama naran kompletu..." required>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label small fw-bold">Departamentu (Unidade)</label>
                        <input type="text" name="unidade_traballu" class="form-control rounded-3" placeholder="Ezemplu: Admin, Logistika, IT...">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label small fw-bold">Kargu / Posisaun</label>
                        <input type="text" name="kargu" class="form-control rounded-3" placeholder="Ezemplu: Staff, Xefe Seksaun...">
                    </div>

                    <div class="col-12">
                        <label class="form-label small fw-bold">Foto Perfil</label>
                        <div class="input-group">
                            <input type="file" name="foto" class="form-control rounded-3" accept="image/*">
                        </div>
                        <small class="text-muted mt-2 d-block">Formatu: JPG, PNG. Max: 2MB.</small>
                    </div>

                    <div class="col-12 mt-5">
                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-primary btn-premium px-5 py-3">
                                <i class="fas fa-save me-2"></i>Rai Dadus
                            </button>
                            <a href="{% url 'dashboard_pegawai' %}" class="btn btn-light btn-premium px-5 py-3 text-muted">Kansela</a>
                        </div>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
